name: Deploy Overview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-overview
  cancel-in-progress: false

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -eo pipefail
            exec 9>/tmp/overview-deploy.lock
            flock -w 900 9
            cd /root/overview_apps

            git pull --ff-only origin main

            # علّم الـ image الحالي للـ rollback
            docker tag overview-frontend:latest overview-frontend:rollback 2>/dev/null || true

            docker compose up -d --build --force-recreate

            # health check
            ok=0
            for i in $(seq 1 20); do
              if docker compose exec -T overview-frontend wget -q -O /dev/null http://127.0.0.1/; then ok=1; break; fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "DEPLOY FAILED. Logs:"
              docker compose logs --tail 60 overview-frontend || true
              if docker image inspect overview-frontend:rollback >/dev/null 2>&1; then
                echo "Rolling back..."
                docker tag overview-frontend:rollback overview-frontend:latest
                docker compose up -d --no-build --force-recreate
              fi
              exit 1
            fi

            echo "Deploy OK"
            docker image prune -f
